apiVersion: apps/v1
kind: Deployment
metadata:
  name: sleeper-deployment
spec:
  replicas: 10
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sleeper2-APP
  template:
    metadata:
      labels:
        app: sleeper2-APP
    spec:
      containers:
        - name: busybox
          image: busybox
          command:
            [
              "sh",
              "-c",
              "while true; do echo '$(hostname) - $(date)'; sleep $(SLEEP_DURATION); done",
            ]
          env:
            - name: SLEEP_DURATION
              value: "17"
